<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Post del pomeriggio Cercocasa</title>
<style>
@font-face { font-family: "Oswald"; font-weight: 500; src: url("fonts/oswald-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Oswald"; font-weight: 600; src: url("fonts/oswald-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Oswald"; font-weight: 700; src: url("fonts/oswald-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-weight: 500; src: url("fonts/montserrat-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-weight: 600; src: url("fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-weight: 700; src: url("fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #17171a; }
body { font-family: "Montserrat", sans-serif; color: #fff; --accent: #DB9C12; --on: #1F1F1F; }
.scena { position: absolute; inset: 0; opacity: 0; overflow: hidden; background: #17171a; }
.scena .foto { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; will-change: transform; }
.scena .velo { position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.10) 22%, rgba(0,0,0,.08) 42%, rgba(0,0,0,.78) 72%, rgba(0,0,0,.90) 100%); }
.scena.gancio .velo { background: linear-gradient(180deg, rgba(0,0,0,.66) 0%, rgba(0,0,0,.50) 40%, rgba(0,0,0,.82) 100%); }
.scena.scheda .fondo { position: absolute; inset: 0;
  background: radial-gradient(1200px 900px at 20% 18%, #2b2b30 0%, #17171a 62%); }
.scena.scheda .riga { position: absolute; left: 84px; top: 520px; width: 14px; height: 620px; background: var(--accent); }
.blocco { position: absolute; left: 84px; right: 84px; }
.gancio .blocco { top: 520px; }
.scena.gancio.senza { background: var(--accent); }
.scena.gancio.senza .fondo { background: linear-gradient(160deg, rgba(255,255,255,.14) 0%, rgba(0,0,0,.20) 100%); }
.gancio.senza .blocco { top: 600px; }
.gancio.senza .titolo { color: var(--on); text-shadow: none; font-size: 150px; }
.gancio.senza .occhio { background: #17171a; color: #fff; }
.foto-scena .blocco { bottom: 640px; }
.scheda .blocco { left: 140px; top: 520px; }
.occhio { display: inline-block; background: var(--accent); color: var(--on); font-weight: 700; font-size: 38px;
  letter-spacing: .5px; padding: 14px 26px; margin-bottom: 30px; }
.titolo { font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase; line-height: 1.04;
  font-size: 128px; letter-spacing: -.5px; text-shadow: 0 4px 26px rgba(0,0,0,.45); overflow-wrap: break-word; }
.foto-scena .titolo { font-size: 132px; }
.scheda .titolo { font-size: 124px; text-shadow: none; }
.sotto { font-weight: 600; font-size: 46px; line-height: 1.24; margin-top: 28px; color: #f1efe9; max-width: 900px;
  text-shadow: 0 2px 14px rgba(0,0,0,.5); }
.scheda .sotto { text-shadow: none; color: #d9d6cf; font-size: 52px; }
.logo-ag { display: inline-block; background: #fff; border-radius: 14px; padding: 22px 28px; margin-bottom: 34px;
  box-shadow: 0 8px 30px rgba(0,0,0,.4); line-height: 0; }
.logo-ag img { max-width: 420px; max-height: 230px; width: auto; height: auto; object-fit: contain; }
.fine .logo-ag { position: absolute; left: 50%; transform: translateX(-50%); top: 1310px; margin: 0; padding: 16px 22px; }
.fine .logo-ag img { max-width: 300px; max-height: 150px; }
.numero { position: absolute; right: 84px; top: 300px; font-family: "Oswald", sans-serif; font-weight: 700;
  font-size: 230px; line-height: 1; color: var(--accent); text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.fonte { position: absolute; left: 140px; right: 84px; top: 1240px; font-weight: 500; font-size: 30px; color: #a9a6a0; }
#marchio { position: absolute; left: 60px; top: 150px; display: flex; align-items: center; gap: 22px; z-index: 5; }
#marchio img { width: 132px; height: 132px; border-radius: 50%; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
#marchio span { font-weight: 700; font-size: 34px; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
#sottotitoli { position: absolute; left: 70px; right: 70px; top: 1330px; text-align: center; z-index: 6; }
#sottotitoli span { display: inline-block; background: rgba(15,15,17,.86); color: #fff; font-weight: 700; font-size: 54px;
  line-height: 1.18; padding: 16px 30px; border-radius: 10px; }
.fine { background: #17171a; text-align: center; }
.fine .fondo { position: absolute; inset: 0; background: radial-gradient(900px 900px at 50% 36%, #303036 0%, #17171a 66%); }
.fine img.logo { position: absolute; left: 50%; top: 300px; width: 380px; height: 380px; margin-left: -190px; border-radius: 50%;
  box-shadow: 0 10px 50px rgba(0,0,0,.5); }
.fine .segui { position: absolute; left: 60px; right: 60px; top: 740px; font-family: "Oswald", sans-serif; font-weight: 700;
  font-size: 118px; text-transform: uppercase; line-height: 1.05; }
.fine .segui b { color: var(--accent); font-weight: 700; }
.fine .perche { position: absolute; left: 90px; right: 90px; top: 1010px; font-weight: 600; font-size: 46px; line-height: 1.25; color: #e6e3dc; }
.fine .profilo { position: absolute; left: 0; right: 0; top: 1170px; }
.fine .profilo span { display: inline-block; background: var(--accent); color: var(--on); font-weight: 700; font-size: 46px; padding: 18px 36px; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="marchio"><img src="logo-tondo.png" alt=""><span>Cercocasa Umbria</span></div>
<div id="sottotitoli"></div>
<script>
const P = window.POST || { accent: "#DB9C12", onAccent: "#1F1F1F", total: 12000, handle: "@cercocasadovecome",
  scenes: [
    { kind: "gancio", start: 0, end: 4000, eye: "Lunedì · Il mercato", title: "Quanto costa casa a Perugia oggi?", sub: "" },
    { kind: "scheda", start: 4000, end: 8000, eye: "Prezzo tipico", title: "€ 135.000", sub: "La metà delle case in vendita costa meno", source: "Dati: 24 annunci su cercocasaumbria.it" },
    { kind: "fine", start: 8000, end: 12000 } ],
  captions: [{ start: 300, end: 2000, text: "Quanto costa comprare" }, { start: 2000, end: 3800, text: "casa a Perugia oggi?" }] };
document.body.style.setProperty("--accent", P.accent);
document.body.style.setProperty("--on", P.onAccent);
const esc = s => String(s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const cont = document.getElementById("scene");
const nodi = P.scenes.map((s, i) => {
  const d = document.createElement("div");
  if (s.kind === "fine") {
    d.className = "scena fine";
    d.innerHTML = `<div class="fondo"></div><img class="logo" src="logo-tondo.png" alt="">
      <div class="segui">Segui <b>Cercocasa Umbria</b></div>
      <div class="perche">${esc(s.sub || "Ogni giorno nuove case in vendita, in affitto e all'asta in Umbria")}</div>
      <div class="profilo"><span>${esc(P.handle || "@cercocasadovecome")}</span></div>`
      + (s.logo ? `<div class="logo-ag"><img src="${s.logo}" alt=""></div>` : "");
  } else {
    const foto = !!s.photo;
    d.className = "scena " + (s.kind === "gancio" ? "gancio" + (foto ? "" : " senza") : foto ? "foto-scena" : "scheda");
    d.innerHTML = (foto ? `<img class="foto" src="${s.photo}" alt=""><div class="velo"></div>`
                        : `<div class="fondo"></div>` + (s.kind === "gancio" ? "" : `<div class="riga"></div>`))
      + (s.num ? `<div class="numero">${esc(s.num)}</div>` : "")
      + `<div class="blocco">${s.logo ? `<div class="logo-ag"><img src="${s.logo}" alt=""></div><br>` : ""}${s.eye ? `<div class="occhio">${esc(s.eye)}</div><br>` : ""}
           <div class="titolo">${esc(s.title)}</div>${s.sub ? `<div class="sotto">${esc(s.sub)}</div>` : ""}</div>`
      + (s.source ? `<div class="fonte">${esc(s.source)}</div>` : "");
  }
  cont.appendChild(d);
  return d;
});
// i titoli lunghi si rimpiccioliscono finché entrano nello spazio
function adatta() {
  nodi.forEach((d, i) => {
    const t = d.querySelector(".titolo"), b = d.querySelector(".blocco");
    if (!t || !b) return;
    const massimo = d.classList.contains("gancio") ? (d.querySelector(".logo-ag") ? 800 : 760) : d.classList.contains("scheda") ? 680 : 560;
    let dim = parseFloat(getComputedStyle(t).fontSize);
    d.style.opacity = 1;
    while ((b.scrollHeight > massimo || t.scrollWidth > b.clientWidth + 2) && dim > 54) { dim -= 4; t.style.fontSize = dim + "px"; }
    d.style.opacity = 0;
  });
}
const DISS = 320, ENTRA = 420;
const liscio = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
window.seek = function (t) {
  P.scenes.forEach((s, i) => {
    const d = nodi[i];
    let op = 0;
    if (t >= s.start && t < s.end) op = i === 0 ? 1 : Math.min(1, (t - s.start) / DISS);
    else if (t >= s.end && i === P.scenes.length - 1) op = 1;
    d.style.opacity = op;
    d.style.zIndex = t >= s.start ? i + 1 : 0;
    if (!op) return;
    const p = Math.min(1, Math.max(0, (t - s.start) / (s.end - s.start)));
    const img = d.querySelector(".foto");
    if (img) {   // movimento lento e fluido della foto: avanti e di lato, alternato da una scena all'altra
      const verso = i % 2 ? -1 : 1;
      img.style.transform = `scale(${1.02 + 0.10 * p}) translate(${verso * (1.4 - 2.8 * p)}%, ${-0.8 * p}%)`;
    }
    const b = d.querySelector(".blocco");
    if (b) {
      const e = i === 0 ? 1 : liscio((t - s.start - 80) / ENTRA);
      b.style.opacity = e;
      b.style.transform = `translateY(${(1 - e) * 46}px)`;
    }
    const n = d.querySelector(".numero");
    if (n) { const e = liscio((t - s.start) / ENTRA); n.style.opacity = e; n.style.transform = `scale(${0.8 + 0.2 * e})`; }
    if (s.kind === "fine") {
      const e = liscio((t - s.start) / 600);
      d.querySelector(".logo").style.transform = `scale(${0.86 + 0.14 * e})`;
      d.querySelector(".profilo").style.opacity = liscio((t - s.start - 500) / 400);
    }
  });
  const ultima = P.scenes[P.scenes.length - 1];
  document.getElementById("marchio").style.opacity = (ultima.kind === "fine" && t >= ultima.start) ? 0 : 1;
  const c = (P.captions || []).find(c => t >= c.start && t < c.end);
  document.getElementById("sottotitoli").innerHTML = c ? `<span>${esc(c.text)}</span>` : "";
};
window.pronto = document.fonts.ready.then(() => { adatta(); window.seek(0); return true; });
</script>
</body>
</html>
