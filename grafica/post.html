<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
/* Grafica "Cinema" Cercocasa Umbria: foto a tutto schermo, scritte grandi parola per parola,
   barra di avanzamento come le storie, prezzo oro. Stessi dati di prima (window.POST). */
@font-face{font-family:Oswald;font-weight:500;src:url(fonts/oswald-latin-500-normal.woff2)}
@font-face{font-family:Oswald;font-weight:600;src:url(fonts/oswald-latin-600-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
:root{--oro:#E2A928;--oro2:#F6C453;--nero:#0E0E0F;--acc:#E2A928;--onAcc:#151515}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#000}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;background:var(--nero)}

/* foto a tutto schermo */
.foto{position:absolute;inset:0;overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vuoto{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1b1b1c}
.vuoto img{position:static;width:46%;height:auto;object-fit:contain}
/* velature per leggere le scritte */
.velo-su{position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,0))}
.velo-giu{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.78) 38%,rgba(0,0,0,0) 100%)}

/* barra in alto: segmenti come le storie (uno per frase) */
.barre{position:absolute;top:44px;left:40px;right:40px;display:flex;gap:10px}
.barre i{flex:1;height:7px;border-radius:7px;background:rgba(255,255,255,.28);overflow:hidden}
.barre b{display:block;height:100%;width:100%;background:#fff;transform-origin:0 50%;transform:scaleX(0)}

.testa{position:absolute;top:80px;left:40px;right:40px;display:flex;align-items:center;justify-content:space-between}
.testa img{height:118px;width:auto;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.citta{display:flex;align-items:center;gap:12px;font-family:Oswald;font-weight:600;font-size:38px;letter-spacing:.08em;padding:14px 26px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35)}
.citta svg{width:34px;height:34px}

/* blocco annuncio in basso */
.blocco{position:absolute;left:56px;right:56px;bottom:470px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.etichetta{font-family:Oswald;font-weight:700;font-size:40px;letter-spacing:.12em;background:var(--acc);color:var(--onAcc);padding:8px 26px;border-radius:10px}
.titolo{font-family:Oswald;font-weight:600;font-size:60px;line-height:1.04;text-transform:uppercase;text-shadow:0 3px 18px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prezzo{display:flex;align-items:baseline;gap:16px;line-height:.9}
.prezzo .pre,.prezzo .suf{font-family:Oswald;font-weight:500;font-size:46px;color:#fff}
.prezzo .n{font-family:Oswald;font-weight:700;font-size:156px;color:var(--oro2);font-variant-numeric:tabular-nums;text-shadow:0 6px 30px rgba(0,0,0,.55)}
.dati{display:flex;flex-wrap:wrap;gap:14px}
.dati span{display:flex;align-items:center;gap:10px;font-weight:700;font-size:30px;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28)}
.dati svg{width:32px;height:32px}

/* frasi della voce: grandi, parola per parola, numeri in oro */
.frase{position:absolute;left:60px;right:60px;top:600px;text-align:center;font-family:Oswald;font-weight:700;font-size:96px;line-height:1.02;text-transform:uppercase;opacity:0}
.frase w{display:inline-block;margin:0 .12em;opacity:0;text-shadow:0 5px 26px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.9)}
.frase w.o{color:var(--oro2)}

/* gancio iniziale */
.gancio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:0 60px 260px;text-align:center;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.35),rgba(0,0,0,.72))}
.gancio .g1{font-family:Oswald;font-weight:700;font-size:118px;line-height:1.0;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.gancio .g1 em{font-style:normal;color:var(--oro2)}
.gancio .g2{font-family:Oswald;font-weight:700;font-size:72px;background:var(--acc);color:var(--onAcc);padding:10px 38px;border-radius:14px;transform:rotate(-2deg)}

/* chiusura: QR */
.qr{position:absolute;left:0;right:0;top:520px;margin:0 auto;width:fit-content;background:#fff;color:#151515;border-radius:30px;padding:32px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);opacity:0;text-align:center}
.qr img{width:420px;height:420px;display:block}
.qr .c{font-family:Oswald;font-weight:700;font-size:52px;line-height:1}
.qr .s{font-weight:600;font-size:26px;color:#555}

/* animazioni (ferme, posizionate da window.seek) */
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16)}}
@keyframes inFoto{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:scale(1.02)}}
@keyframes su{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes dx{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes parola{0%{opacity:0;transform:translateY(30px) scale(.8)}60%{opacity:1;transform:translateY(-6px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes vedi{from{opacity:1}to{opacity:1}}
@keyframes via{from{opacity:1}to{opacity:0}}
@keyframes riempi{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes batti{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes qrIn{from{opacity:0;transform:translateY(50px) scale(.92)}to{opacity:1;transform:none}}
.e{animation-timing-function:cubic-bezier(.2,.8,.2,1)!important;animation-fill-mode:both!important}

/* 9:16 Reel: lo spazio in basso resta libero per testo e pulsanti di Instagram */
html.v,html.v body{height:1920px}
.v .post{height:1920px}
/* 4:5 e quadrato */
.post:not(.vv) .blocco{bottom:60px}
.post:not(.vv) .frase{top:400px;font-size:82px}
.post:not(.vv) .qr{top:300px}
html.q,html.q body{height:1080px}
.q .post{height:1080px}
.q .barre{top:28px;left:28px;right:28px}
.q .testa{top:52px;left:28px;right:28px}
.q .testa img{height:78px}
.q .citta{font-size:28px;padding:10px 20px}
.q .citta svg{width:26px;height:26px}
.q .blocco{left:36px;right:36px;bottom:34px;gap:8px}
.q .etichetta{font-size:28px;padding:6px 18px}
.q .titolo{font-size:42px}
.q .prezzo .n{font-size:104px}
.q .prezzo .pre,.q .prezzo .suf{font-size:32px}
.q .dati span{font-size:22px;padding:7px 14px}
.q .dati svg{width:24px;height:24px}
.q .frase{top:270px;font-size:70px;left:40px;right:40px}
.q .gancio{padding:0 40px 120px}
.q .gancio .g1{font-size:84px}
.q .gancio .g2{font-size:52px}
.q .qr{top:150px;padding:22px 28px}
.q .qr img{width:270px;height:270px}
.q .qr .c{font-size:38px}
.q .qr .s{font-size:20px}
.q .velo-giu{height:70%}
</style>
</head>
<body>
<div class="post" id="post"></div>
<script>
const ICONS={
 area:'<rect x="4" y="4" width="16" height="16"></rect><path d="M9 15l6-6M11 9h4v4"></path>',
 bed:'<path d="M3 19v-8h18v8M3 15h18M6 11V8h5v3"></path>',
 bath:'<path d="M4 12h16v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM7 12V6a2 2 0 0 1 4 0"></path>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path>',
 court:'<path d="M3 21h18M5 21V11M9.5 21V11M14.5 21V11M19 21V11M2 11l10-6 10 6"></path>',
 pin:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle>'
};
const P=window.POST;
const R=document.documentElement;
if(P.vertical)R.classList.add('v');
if(P.square)R.classList.add('q');
if(P.titleShort&&(P.square||P.title.length>48))P.title=P.titleShort;   // titolo corto quando quello lungo non sta
const el=document.getElementById('post');
if(P.vertical)el.classList.add('vv');
// colore del giorno sull'etichetta e sulla domanda; le aste restano oro
if(P.accent&&P.theme!=='asta'){el.style.setProperty('--acc',P.accent);el.style.setProperty('--onAcc',P.onAccent||'#fff');}

const SCENES=(P.scenes&&P.scenes.length)?P.scenes:
  ((P.photos||[]).length?[{photo:P.photos[0],text:'',start:0,dur:P.total||9000}]:(P.photo?[{photo:P.photo,text:'',start:0,dur:9000}]:[]));
const TOTAL=P.total||9000;
const H=P.hook?P.hook.dur:0;                 // fine del gancio: da qui entra il blocco annuncio
const t0=H?H+150:500;
const svg=(n)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;
const origini=['50% 50%','30% 40%','70% 45%','50% 70%','40% 60%'];

// pagina "neutra" (nessuna foto di quella stanza): foto principale sfocata, la frase resta protagonista
const neutra=f=>/neutra\.jpg/.test(f||'');
const foto=SCENES.map((sc,i)=>{const n=neutra(sc.photo)&&!neutra(SCENES[0].photo);
  return `<img src="${n?SCENES[0].photo:sc.photo}" style="${n?'filter:blur(26px) brightness(.55) saturate(1.2);':''}transform-origin:${origini[i%5]};animation:${i?`inFoto 600ms ${sc.start}ms both,`:''}kb ${(sc.dur||TOTAL)+800}ms ${sc.start}ms linear both">`;}).join('');

const barre=SCENES.map(sc=>`<i><b style="animation:riempi ${sc.dur}ms ${sc.start}ms linear both"></b></i>`).join('');

// frase parola per parola: le parole compaiono in tempo con la voce (distribuite sulla durata della scena)
const frasi=(P.captions||SCENES).filter(sc=>sc.text&&!(P.qr&&sc.start>=P.qr.start-50)).map(sc=>{   // sul QR la frase è già nella scheda
  const parole=sc.text.replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean);
  const passo=Math.max(110,Math.min(320,(sc.dur-700)/Math.max(1,parole.length)));
  const w=parole.map((p,i)=>`<w class="${/\d|€/.test(p)?'o':''}" style="animation:parola 420ms ${sc.start+120+i*passo}ms both">${p}</w>`).join(' ');
  return `<div class="frase" style="animation:vedi 1ms ${sc.start}ms both,via 260ms ${sc.start+sc.dur-260}ms forwards">${w}</div>`;
}).join('');

const g=P.hook?`<div class="gancio" style="animation:via 380ms ${P.hook.dur}ms forwards"><span class="g1">${
   P.hook.text.replace(/(€\s?[\d.]+(?:\s*al mese)?)/,'<em>$1</em>')}</span>${P.hook.ask?`<span class="g2">${P.hook.ask}</span>`:''}</div>`:'';

el.innerHTML=`
<div class="foto">${SCENES.length?foto:`<div class="vuoto"><img src="logo.png"></div>`}</div>
<div class="velo-su"></div><div class="velo-giu"></div>
<div class="barre">${barre}</div>
<div class="testa"><img class="e" src="logo.png" alt="" style="animation:dx 500ms 0ms"><span class="citta e" style="animation:su 500ms 100ms">${svg('pin')}${P.city}</span></div>
<div class="blocco">
  <span class="etichetta e" style="animation:dx 500ms ${t0}ms">${P.badge}</span>
  <span class="titolo e" style="animation:su 550ms ${t0+120}ms;${P.title.length>60?'font-size:44px':P.title.length>34?'font-size:52px':''}">${P.title}</span>
  <div class="prezzo e" style="animation:su 600ms ${t0+240}ms">${P.pre?`<span class="pre">${P.pre}</span>`:''}<span class="n" id="price" style="animation:batti 700ms ${t0+1300}ms both">${P.price}</span>${P.suf?`<span class="suf">${P.suf}</span>`:''}</div>
  <div class="dati">${(P.specs||[]).map((s,i)=>`<span class="e" style="animation:su 450ms ${t0+420+i*120}ms">${svg(s[0])}${s[1]}</span>`).join('')}</div>
</div>
${frasi}
${g}
${P.qr?`<div class="qr" style="animation:qrIn 520ms ${P.qr.start+200}ms both"><img src="${P.qr.img}" alt=""><span class="c">Codice ${P.qr.code}</span><span class="s">Foto e contatti: link nella bio</span></div>`:''}`;

// il prezzo "conta" fino al valore vero quando entra il blocco
const target=parseInt(String(P.price).replace(/\D/g,''),10)||0;
const fmt=n=>'€ '+n.toLocaleString('it-IT');
window.seek=function(ms){
  document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms});
  if(target>0){
    const k=Math.min(1,Math.max(0,(ms-(t0+240))/1000));
    const e=1-Math.pow(1-k,3);
    let v=Math.round(target*e);
    if(k<1&&target>=10000)v=Math.round(v/10)*10;
    document.getElementById('price').textContent=fmt(k>=1?target:v);
  }
};
window.seek(0);
</script>
</body>
</html>
