<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Oswald;font-weight:500;src:url(fonts/oswald-latin-500-normal.woff2)}
@font-face{font-family:Oswald;font-weight:600;src:url(fonts/oswald-latin-600-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
.post{width:1080px;height:1350px;font-family:Montserrat,sans-serif;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text)}
.main{flex-grow:1;padding:36px 36px 28px;display:flex;flex-direction:column}
.photo{position:relative;height:860px;flex-shrink:0;border-radius:24px;background:var(--photoBg);overflow:hidden}
.photo-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--photoFg)}
.photo-inner span{font-size:22px;font-weight:600;letter-spacing:.12em}
.badge{position:absolute;top:36px;left:36px;background:var(--badgeBg);color:var(--badgeFg);font-family:Oswald;font-size:50px;font-weight:700;letter-spacing:.06em;padding:14px 40px;border-radius:999px}
.chip{position:absolute;top:36px;right:36px;background:var(--chipBg);color:var(--chipFg);font-size:32px;font-weight:700;letter-spacing:.08em;padding:20px 32px;border-radius:999px}
.card{align-self:flex-start;margin:-96px 0 0 36px;background:var(--cardBg);color:var(--priceFg);border-radius:20px;padding:28px 40px;display:flex;align-items:baseline;gap:14px;position:relative}
.card .pre{font-size:30px;font-weight:600}
.card .price{font-family:Oswald;font-size:112px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.card .suf{font-size:30px;font-weight:600;color:#B4B6B5}
.info{flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:0 12px}
.title{font-family:Oswald;font-size:52px;font-weight:500;line-height:1.08;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.specs{display:flex;gap:40px;font-size:26px;font-weight:600;color:var(--specFg)}
.specs>span{display:flex;align-items:center;gap:12px}
.foot{height:180px;flex-shrink:0;background:var(--footBg);border-top:var(--footBorder);display:flex;align-items:center;justify-content:space-between;padding:0 48px}
.foot img{height:124px;width:auto}
.foot .cta{font-size:22px;font-weight:600;color:#B4B6B5;letter-spacing:.04em;text-align:right;line-height:1.4}

/* timeline: every animation is paused and positioned by window.seek(ms) */
@keyframes photoIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes fromLeft{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@keyframes fromRight{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
@keyframes footIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes photoSwap{from{opacity:0}to{opacity:1}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes phraseIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes phraseOut{from{opacity:1}to{opacity:0}}
.phrase{position:absolute;left:0;right:0;bottom:128px;margin:0 auto;width:fit-content;max-width:860px;text-align:center;background:rgba(255,255,255,.96);color:#1F1F1F;font-family:Oswald;font-size:46px;font-weight:600;line-height:1.12;padding:14px 30px;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.ease{animation-timing-function:cubic-bezier(.2,.8,.2,1)!important;animation-fill-mode:both!important}
.photo{animation:photoIn 900ms 0ms}
.photo-inner{animation:drift 8000ms 900ms linear both}
.badge{animation:fromLeft 550ms 500ms}
.chip{animation:fromRight 550ms 650ms}
.card{animation:up 650ms 950ms}
.price-wrap{animation:pop 600ms 2100ms both}
.title{animation:up 550ms 1450ms}
.s0{animation:up 500ms 1750ms}.s1{animation:up 500ms 1900ms}.s2{animation:up 500ms 2050ms}
.foot{animation:footIn 700ms 150ms}

/* versione verticale 9:16 per i Reel di Instagram: logo in alto, foto più alta,
   spazio libero in basso dove Instagram mette didascalia e pulsanti */
html.v,html.v body{height:1920px}
.v .post{height:1920px}
.v .foot{order:-1;border-top:none;border-bottom:var(--footBorder)}
.v .main{padding:32px 36px 290px}
.v .photo{height:1180px}
.v .title{font-size:56px}
.v .specs{font-size:30px}
@keyframes footInTop{from{transform:translateY(-100%)}to{transform:none}}
.v .foot{animation-name:footInTop}
.qrcard{position:absolute;left:0;right:0;top:50%;margin:0 auto;width:fit-content;transform:translateY(-50%);background:#FFFFFF;color:#1F1F1F;border-radius:28px;padding:30px 36px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);opacity:0;text-align:center}
.qrcard img{width:340px;height:340px;display:block}
.qrcard .qrcode{font-family:Oswald;font-size:46px;font-weight:700;line-height:1}
.qrcard .qrsite{font-size:26px;font-weight:600;color:#5A5A5A}
.v .qrcard img{width:420px;height:420px}
@keyframes qrIn{from{opacity:0;margin-top:40px}to{opacity:1;margin-top:0}}

/* versione quadrata 1080x1080 per Facebook: stessa grafica, proporzioni ridotte, niente fasce */
html.q,html.q body{height:1080px}
.q .post{height:1080px}
.q .main{padding:26px 30px 18px}
.q .photo{height:600px;border-radius:20px}
.q .badge{font-size:36px;padding:10px 28px;top:24px;left:24px}
.q .chip{font-size:24px;padding:14px 24px;top:24px;right:24px}
.q .card{margin:-74px 0 0 26px;padding:18px 30px;border-radius:16px}
.q .card .price{font-size:84px}
.q .card .pre,.q .card .suf{font-size:24px}
.q .info{gap:14px}
.q .title{font-size:40px}
.q .specs{font-size:23px;gap:30px}
.q .specs svg{width:26px;height:26px}
.q .foot{height:132px;padding:0 36px}
.q .foot img{height:92px}
.q .foot .cta{font-size:19px}
.q .phrase{bottom:92px;font-size:38px;padding:10px 24px}
.q .qrcard{padding:20px 26px;gap:8px}
.q .qrcard img{width:250px;height:250px}
.q .qrcard .qrcode{font-size:36px}
.q .qrcard .qrsite{font-size:20px}
</style>
</head>
<body>
<div class="post" id="post"></div>
<script>
const ICONS={
 area:'<rect x="4" y="4" width="16" height="16"></rect><path d="M9 15l6-6M11 9h4v4"></path>',
 bed:'<path d="M3 19v-8h18v8M3 15h18M6 11V8h5v3"></path>',
 bath:'<path d="M4 12h16v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM7 12V6a2 2 0 0 1 4 0"></path>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path>',
 court:'<path d="M3 21h18M5 21V11M9.5 21V11M14.5 21V11M19 21V11M2 11l10-6 10 6"></path>',
 pin:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle>'
};
const THEMES={
 vendita:{bg:'#DB9C12',text:'#1F1F1F',photoBg:'#F3E3BF',photoFg:'#5A4A26',badgeBg:'#FFFFFF',badgeFg:'#1F1F1F',chipBg:'#1F1F1F',chipFg:'#FFFFFF',cardBg:'#1F1F1F',priceFg:'#FFFFFF',specFg:'#1F1F1F',icon:'#1F1F1F',footBg:'#1F1F1F',footBorder:'none'},
 affitto:{bg:'#F4F2ED',text:'#1F1F1F',photoBg:'#D3D0C8',photoFg:'#4A4740',badgeBg:'#FFFFFF',badgeFg:'#1F1F1F',chipBg:'#1F1F1F',chipFg:'#FFFFFF',cardBg:'#1F1F1F',priceFg:'#DB9C12',specFg:'#1F1F1F',icon:'#1F1F1F',footBg:'#1F1F1F',footBorder:'none'},
 asta:{bg:'#262626',text:'#FFFFFF',photoBg:'#3D3D3D',photoFg:'#C9CBCA',badgeBg:'#DB9C12',badgeFg:'#1F1F1F',chipBg:'#FFFFFF',chipFg:'#1F1F1F',cardBg:'#DB9C12',priceFg:'#1F1F1F',specFg:'#E6E6E6',icon:'#DB9C12',footBg:'#141414',footBorder:'4px solid #DB9C12'}
};
const P=window.POST;
if(P.vertical)document.documentElement.classList.add('v');
if(P.square)document.documentElement.classList.add('q');
const T=THEMES[P.theme];
const el=document.getElementById('post');
// foto: la prima resta la principale; le altre si alternano e alla fine torna la prima (= copertina)
// scene: [{photo, text, start(ms), dur(ms)}]: ogni scena cambia foto e mostra la frase detta dalla voce
const SCENES=(P.scenes&&P.scenes.length)?P.scenes:
  ((P.photos||[]).length?[{photo:P.photos[0],text:'',start:0,dur:P.total||9000}]:(P.photo?[{photo:P.photo,text:'',start:0,dur:9000}]:[]));
const TOTAL=P.total||9000;
const photos=SCENES.map(s=>s.photo);
for(const k in T) el.style.setProperty('--'+k,T[k]);
const svg=(n,s,sw)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const icon=n=>`<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="${T.icon}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
el.innerHTML=`
<div class="main">
  <div class="photo ease">
    <div class="photo-inner" style="animation-duration:${TOTAL}ms">${photos.length?SCENES.map((sc,i)=>`<img src="${sc.photo}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:${['50% 50%','30% 40%','70% 40%','50% 70%'][i%4]};animation:${i?`photoSwap 450ms ${sc.start}ms both,`:''}kenburns ${(sc.dur||TOTAL)+600}ms ${sc.start}ms linear both">`).join(''):`<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v12H3z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg><span>FOTO DELL’ANNUNCIO</span>`}</div>
    <span class="badge ease">${P.badge}</span>
    <span class="chip ease">${P.city}</span>
    ${P.qr?`<div class="qrcard" style="animation:qrIn 500ms ${P.qr.start+200}ms both"><img src="${P.qr.img}" alt=""><span class="qrcode">Codice ${P.qr.code}</span><span class="qrsite">Link nella bio · cercocasaumbria.it</span></div>`:''}
    ${(P.captions||SCENES).filter(sc=>sc.text).map(sc=>`<span class="phrase" style="animation:phraseIn 420ms ${sc.start+150}ms both,phraseOut 300ms ${sc.start+sc.dur-250}ms forwards">${sc.text}</span>`).join('')}
  </div>
  <div class="card ease"><div class="price-wrap" style="display:flex;align-items:baseline;gap:14px">${P.pre?`<span class="pre">${P.pre}</span>`:''}<span class="price" id="price">${P.price}</span>${P.suf?`<span class="suf">${P.suf}</span>`:''}</div></div>
  <div class="info">
    <span class="title ease" style="${P.title.length>60?'font-size:38px':P.title.length>34?'font-size:44px':''}">${P.title}</span>
    <div class="specs">${P.specs.map((s,i)=>`<span class="s${i} ease">${icon(s[0])}${s[1]}</span>`).join('')}</div>
  </div>
</div>
<div class="foot ease"><img src="logo.png" alt=""><span class="cta">${P.cta}</span></div>`;
// count-up of the price between 1000 and 2000 ms
const target=parseInt(P.price.replace(/\D/g,''),10)||0;
const fmt=n=>'€ '+n.toLocaleString('it-IT');
window.seek=function(ms){
  document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms});
  if(!isNaN(target)&&target>0){
    const k=Math.min(1,Math.max(0,(ms-1000)/1000));
    const e=1-Math.pow(1-k,3);
    let v=Math.round(target*e);
    v=k>=1?target:Math.round(v/ (target>=10000?10:1))*(target>=10000?10:1);
    document.getElementById('price').textContent=fmt(v);
  }
};
window.seek(0);
</script>
</body>
</html>
