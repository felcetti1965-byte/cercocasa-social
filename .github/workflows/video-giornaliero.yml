name: Video giornaliero Cercocasa

on:
  schedule:
    - cron: "22 6 * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova (crea i video ma non pubblica)"
        type: boolean
        default: true
      quanti:
        description: "Quanti post (1-6): vendita, affitto, asta a Terni e Perugia"
        type: number
        default: 6
      social:
        description: "Solo questi social (es. instagram). Vuoto = quelli di sempre"
        type: string
        default: ""
      slot:
        description: "Un post in più di questo tipo (es. vendita-perugia). Vuoto = i 6 del giorno"
        type: string
        default: ""
      rifai_oggi:
        description: "Ripubblica gli annunci di oggi (sui social indicati sopra)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Installa programmi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
          mkdir -p font
          [ -f font/Montserrat.ttf ] || curl -sSL -o font/Montserrat.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"

      - name: Crea e pubblica il video
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO || 'diretto' }}
          MODO_POST: ${{ vars.MODO_POST || 'diversi' }}
          SOCIAL: ${{ vars.SOCIAL || 'facebook,instagram,tiktok' }}
          SOCIAL_SEI: ${{ inputs.social || 'facebook,instagram,tiktok' }}
          PAUSA_MINUTI: ${{ vars.PAUSA_MINUTI || '3' }}
          MODO_GIORNALIERO: ${{ vars.MODO_GIORNALIERO || 'sei' }}
        run: |
          PROVA=""
          [ "${{ inputs.prova }}" = "true" ] && PROVA="--prova"
          if [ "$MODO_GIORNALIERO" = "uno" ]; then
            # vecchio sistema: un annuncio al giorno delle agenzie della rivista
            python cercocasa_social.py $PROVA
          else
            # 6 post: vendita, affitto e asta a Terni e Perugia, con la grafica nuova
            SLOT_ARG=""
            [ -n "${{ inputs.slot }}" ] && SLOT_ARG="--slot ${{ inputs.slot }}"
            [ "${{ inputs.rifai_oggi }}" = "true" ] && SLOT_ARG="$SLOT_ARG --rifai-oggi"
            python sei_post.py $PROVA --quanti "${{ inputs.quanti || 6 }}" $SLOT_ARG
          fi

      - name: Salva il video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: video/
          retention-days: 14

      - name: Ricorda gli annunci gia pubblicati
        if: ${{ inputs.prova != true }}
        run: |
          git config user.name "cercocasa-bot"
          git config user.email "bot@cercocasaumbria.it"
          git add pubblicati.json
          [ -f tiktok-descrizioni.md ] && git add tiktok-descrizioni.md || true
          [ -f tiktok-token.enc ] && git add tiktok-token.enc || true
          git diff --cached --quiet || git commit -m "Pubblicato video del $(date +%F)"
          git push
