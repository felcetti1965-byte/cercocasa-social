name: Collega TikTok (una volta sola)

on:
  workflow_dispatch:
    inputs:
      indirizzo:
        description: "Incolla l'indirizzo completo della pagina su cui arrivi dopo aver autorizzato l'app TikTok (vuoto = solo controllo)"
        required: false
        default: ""
      stato:
        description: "Codici publish_id TikTok da controllare (separati da spazio)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collega:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -r requirements.txt
      - name: Prepara il link di autorizzazione
        if: inputs.indirizzo == ''
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        run: |
          python - <<'PY' > link-tiktok.txt
          import os, urllib.parse
          q = {"client_key": os.environ["TIKTOK_CLIENT_KEY"], "response_type": "code",
               "scope": "user.info.basic,video.upload,video.publish",
               "redirect_uri": "https://www.cercocasaumbria.it/", "state": "cercocasa"}
          print("https://www.tiktok.com/v2/auth/authorize/?" + urllib.parse.urlencode(q))
          PY
      - uses: actions/upload-artifact@v4
        if: inputs.indirizzo == ''
        with:
          name: link-tiktok
          path: link-tiktok.txt
          retention-days: 1
      - name: Controlla lo stato dei video inviati
        if: inputs.stato != ''
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          STATO: ${{ inputs.stato }}
        run: |
          python - <<'PY'
          import os, cercocasa_social as cs
          t = cs.token_tiktok()
          for pid in os.environ["STATO"].split():
              r = cs.HTTP.post("https://open.tiktokapis.com/v2/post/publish/status/fetch/", json={"publish_id": pid}, timeout=30,
                               headers={"Authorization": f"Bearer {t}", "Content-Type": "application/json; charset=UTF-8"})
              print("STATO", pid, r.status_code, r.text[:400])
          PY
      - name: Salva la chiave TikTok (cifrata)
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          INDIRIZZO: ${{ inputs.indirizzo }}
        run: |
          if [ -n "$INDIRIZZO" ]; then python cercocasa_social.py --collega-tiktok "$INDIRIZZO"; fi
          python cercocasa_social.py --verifica-tiktok || echo 'CONTROLLO TIKTOK NON RIUSCITO'
      - name: Memorizza
        run: |
          git config user.name "cercocasa-bot"
          git config user.email "bot@cercocasaumbria.it"
          git add tiktok-token.enc
          git diff --cached --quiet && exit 0
          git commit -m "Collegato TikTok"
          git push
