name: Cattura sito (temporaneo)
on:
  push:
    branches: [claude/cattura-sito]
jobs:
  cattura:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installa
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null || true
      - name: Foto
        run: bash cattura/foto.sh
      - name: Cattura
        run: python cattura/cattura.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cattura
          path: out/
          retention-days: 3
