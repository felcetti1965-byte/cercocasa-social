const property={

function propertyCard(){
 return `
 <div class="badge">ANNUNCIO DELLA RIVISTA • PAGINA 6</div>
 <div class="place">${property.city} — ${property.zone}</div>
 <div class="price">${property.price}</div>

     href="tel:+390758429576">☎ Chiama agenzia</a>
  <a class="action" style="text-decoration:none"
     href="tel:+393703169268">📱 Chiama cellulare</a>
 </div>`;
}


function escapeHtml(value){
 return String(value ?? '')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');
}


let activeProperty = null;

async function setActiveProperty(id){
 const response = await fetch(
   '/rivista-demo/search.php?id=' + encodeURIComponent(id) + '&_=' + Date.now(),
   {cache:'no-store'}
 );

 if(!response.ok){
   throw new Error('HTTP '+response.status);
 }

 const data = await response.json();

 if(!data || data.ok !== true || !data.property){
   throw new Error('Immobile non disponibile');
 }

 activeProperty = data.property;
 return activeProperty;
}

function needProperty(){
 if(activeProperty) return true;

 openBox('Scegli un immobile',`
  <p class="desc">
   Prima usa <strong>🔎 CERCA IMMOBILE</strong> e premi
   <strong>VEDI</strong> sull'immobile che ti interessa.
  </p>
 `);

 return false;
}

function demoSearch(){
 openBox('Ricerca immobili',`
  <p class="desc">
   Cerca tra <strong>tutti gli immobili pubblicati su Cercocasa Umbria</strong>.
  </p>

  <div style="display:flex;gap:8px">
   <input id="searchField" class="searchinput"
    placeholder="Zona, comune, tipologia o agenzia..."
    style="flex:1">

   <button id="runSearch" class="action">
    CERCA
   </button>
  </div>

  <div id="searchResult"></div>
 `);

 const field=document.getElementById('searchField');
 const result=document.getElementById('searchResult');
 const button=document.getElementById('runSearch');

 async function run(){
   const query=field.value.trim();

   if(query.length<2){
     result.innerHTML='<div class="result">Scrivi almeno 2 caratteri.</div>';
     return;
   }

   result.innerHTML='<div class="result">Ricerca in corso...</div>';

   try{
     const response=await fetch(
       '/rivista-demo/search.php?q='+encodeURIComponent(query)+'&_='+Date.now()
     );

     if(!response.ok){
       throw new Error('HTTP '+response.status);
     }

     const data=await response.json();

     if(!data || data.ok!==true){
       throw new Error('Risposta non valida');
     }

     const items=Array.isArray(data.results) ? data.results : [];

     if(items.length===0){
       result.innerHTML=`
        <div class="result">
         <strong>Nessun immobile trovato.</strong><br>
         Prova con un altro comune, zona, tipologia o agenzia.
        </div>`;
       return;
     }

     let html=`
      <div class="result">
       <strong>${items.length} immobili trovati</strong>
       ${data.agency
        ? `<br><small>Agenzia: ${escapeHtml(data.agency)}</small>`
        : ''}
      </div>

      <div style="display:grid;gap:10px;margin-top:12px">
     `;

     items.forEach(x=>{
       const price=(x.price!==null && x.price!==undefined)
        ? '€ '+Math.round(Number(x.price)).toLocaleString('it-IT')
        : 'Prezzo su richiesta';

       const place=[x.city,x.zone].filter(Boolean).join(' — ');

       let photo='';

       if(Array.isArray(x.photos) && x.photos.length){
         photo='/'+String(x.photos[0]).replace(/^\/+/,'');
       }

       html+=`
        <div style="
         border:1px solid #ddd;
         border-radius:12px;
         padding:12px;
         display:flex;
         gap:13px;
         align-items:center">

         ${photo ? `
          <img src="${escapeHtml(photo)}"
           style="width:105px;height:78px;object-fit:cover;border-radius:8px"
           alt="">` : ''}

         <div style="flex:1;min-width:0">

          <small>${escapeHtml(place)}</small>

          <div style="
           font-size:16px;
           font-weight:800;
           margin:3px 0">
           ${escapeHtml(x.title || '')}
          </div>

          <strong>${escapeHtml(price)}</strong>

          ${x.agency ? `
           <div style="font-size:12px;color:#666;margin-top:3px">
            ${escapeHtml(x.agency)}
           </div>` : ''}

         </div>

         <button
          class="action ccuSelectProperty"
          data-id="${Number(x.id)}">
          VEDI →
         </button>

        </div>`;
     });

     html+='</div>';

     result.innerHTML=html;

     document.querySelectorAll('.ccuSelectProperty').forEach(el=>{
       el.addEventListener('click',async()=>{
         try{
           await setActiveProperty(el.dataset.id);
           demoProperty();
         }catch(err){
           alert('Non riesco ad aprire questo immobile.');
         }
       });
     });

   }catch(err){
     console.error('CCU SEARCH ERROR',err);

     result.innerHTML=`
      <div class="result">
       <strong>Errore durante la ricerca.</strong><br>
       Riprova.
      </div>`;
   }
 }

 button.addEventListener('click',run);

 field.addEventListener('keydown',e=>{
   if(e.key==='Enter'){
     e.preventDefault();
     run();
   }
 });

 field.focus();
}

function demoPhoto(){
 if(!activeProperty){
   openBox('Scegli un immobile',`
    <p class="desc">
     Prima usa <strong>🔎 CERCA IMMOBILE</strong> e premi
     <strong>VEDI</strong> sull'immobile che vuoi consultare.
    </p>
   `);
   return;
 }

 const p=activeProperty;
 const photos=Array.isArray(p.photos) ? p.photos : [];

 const place=[p.city,p.zone].filter(Boolean).join(' — ');
 const price=(p.price!==null && p.price!==undefined)
   ? '€ '+Math.round(Number(p.price)).toLocaleString('it-IT')
   : 'Prezzo su richiesta';

 if(!photos.length){
   openBox('Foto dell’immobile',`
    <div class="place">${escapeHtml(place)}</div>
    <div class="price">${escapeHtml(price)}</div>
    <div style="font-weight:800;margin:8px 0">
     ${escapeHtml(p.title || '')}
    </div>
    <p class="desc">
     Questo immobile non ha fotografie disponibili sul portale.
    </p>
   `);
   return;
 }

 let current=0;

 openBox('Foto dell’immobile',`
  <div class="badge">${photos.length} FOTO REALI</div>

  <div class="place">${escapeHtml(place)}</div>
  <div class="price">${escapeHtml(price)}</div>

  <div style="font-weight:800;margin:8px 0 14px">
   ${escapeHtml(p.title || '')}
  </div>

  <div style="
   position:relative;
   background:#111;
   border-radius:12px;
   overflow:hidden">

   <img id="ccuDynamicPhoto"
    src="/${escapeHtml(String(photos[0]).replace(/^\/+/,''))}"
    style="
     width:100%;
     height:430px;
     object-fit:contain;
     display:block"
    alt="Foto immobile">

   <button id="ccuDynamicPrev"
    style="
     position:absolute;
     left:12px;
     top:50%;
     transform:translateY(-50%);
     width:48px;
     height:48px;
     border:0;
     border-radius:50%;
     font-size:30px;
     cursor:pointer">‹</button>

   <button id="ccuDynamicNext"
    style="
     position:absolute;
     right:12px;
     top:50%;
     transform:translateY(-50%);
     width:48px;
     height:48px;
     border:0;
     border-radius:50%;
     font-size:30px;
     cursor:pointer">›</button>

   <div id="ccuDynamicCount"
    style="
     position:absolute;
     bottom:10px;
     left:50%;
     transform:translateX(-50%);
     background:rgba(0,0,0,.75);
     color:#fff;
     padding:6px 12px;
     border-radius:15px">
     1 / ${photos.length}
   </div>
  </div>
 `);

 const img=document.getElementById('ccuDynamicPhoto');
 const count=document.getElementById('ccuDynamicCount');

 function show(){
   img.src='/'+String(photos[current]).replace(/^\/+/,'');
   count.textContent=(current+1)+' / '+photos.length;
 }

 document.getElementById('ccuDynamicPrev').onclick=()=>{
   current=(current-1+photos.length)%photos.length;
   show();
 };

 document.getElementById('ccuDynamicNext').onclick=()=>{
   current=(current+1)%photos.length;
   show();
 };
}

async function demoSimilar(){
 if(!needProperty()) return;

 const p=activeProperty;

 openBox('Immobili simili',`
  <div class="badge">RICERCA AUTOMATICA</div>

  <div class="place">
   ${escapeHtml([p.city,p.zone].filter(Boolean).join(' — '))}
  </div>

  <p class="desc">
   Cerco altri immobili collegati all'agenzia e alla zona
   dell'immobile selezionato.
  </p>

  <div id="similarResults" class="result">
   Ricerca immobili simili...
  </div>
 `);

 try{
   const r=await fetch(
     'search.php?similar='+encodeURIComponent(p.id),
     {cache:'no-store'}
   );

   const d=await r.json();
   const box=document.getElementById('similarResults');

   if(!d.ok || !d.results || !d.results.length){
     box.innerHTML='Nessun immobile simile disponibile.';
     return;
   }

   let html='';

   d.results.forEach(x=>{
     const price=x.price
       ? '€ '+Math.round(Number(x.price)).toLocaleString('it-IT')
       : 'Prezzo su richiesta';

     const place=[x.city,x.zone].filter(Boolean).join(' — ');

     const photo=(x.photos && x.photos.length)
       ? '/'+x.photos[0].replace(/^\/+/,'')
       : '';

     html+=`
      <div style="
       display:flex;
       gap:12px;
       align-items:center;
       border-bottom:1px solid #ddd;
       padding:12px 0">

       ${photo ? `
        <img src="${escapeHtml(photo)}"
         style="width:100px;height:75px;object-fit:cover;border-radius:8px"
         alt="">` : ''}

       <div style="flex:1;min-width:0">
        <small>${escapeHtml(place)}</small>

        <div style="font-weight:800;margin:3px 0">
         ${escapeHtml(x.title)}
        </div>

        <strong>${escapeHtml(price)}</strong>

        <div style="font-size:12px;color:#666;margin-top:3px">
         ${escapeHtml(x.agency || '')}
        </div>
       </div>

       <button
        class="action selectSimilar"
        data-id="${x.id}">
        VEDI →
       </button>

      </div>`;
   });

   box.innerHTML=html;

   document.querySelectorAll('.selectSimilar').forEach(btn=>{
     btn.onclick=async()=>{
       try{
         await setActiveProperty(btn.dataset.id);
         demoProperty();
       }catch(e){
         alert('Immobile non disponibile');
       }
     };
   });

 }catch(e){
   const box=document.getElementById('similarResults');
   if(box) box.innerHTML='Ricerca momentaneamente non disponibile.';
 }
}


function demoStats(){
 openBox('Statistiche della rivista digitale',`
  <div class="badge">ESEMPIO DATI DEMO</div>

  <p class="desc">
   Ogni interazione della futura rivista può essere misurata.
  </p>

  <div class="stats">
   <div class="stat">
    <strong>327</strong>
    visualizzazioni pagina
   </div>

   <div class="stat">
    <strong>46</strong>
    aperture annuncio
   </div>

   <div class="stat">
    <strong>12</strong>
    contatti
   </div>
  </div>

  <div class="note">
   I numeri visualizzati sono volutamente DATI DEMO.
   La versione definitiva utilizzerà statistiche reali.
  </div>
 `);
}

document.querySelectorAll('[data-demo]').forEach(b=>{
 b.addEventListener('click',()=>{
  const d=b.dataset.demo;

  if(d==='search')demoSearch();
  if(d==='property')demoProperty();
  if(d==='photo')demoPhoto();
  if(d==='contact')demoContact();
  if(d==='live')demoLive();
  if(d==='interest')demoInterest();
  if(d==='similar')demoSimilar();
  if(d==='stats')demoStats();
 });
});

document.getElementById('close').onclick=()=>{
 overlay.classList.remove('show');
};

overlay.addEventListener('click',e=>{
 if(e.target===overlay)overlay.classList.remove('show');
});
</script>

<script id="ccu-mobile-fix-v2-js">
(function(){

 if(!bar.querySelector('.ccu-mobile-toggle')){

  b.type='button';b.className='ccu-mobile-toggle';
  function reset(){
   bar.classList.remove('ccu-open');
   b.textContent='✦ Ricerca AI';
   b.setAttribute('aria-expanded','false');
  }
  reset();bar.prepend(b);
  b.onclick=function(){
   var open=bar.classList.toggle('ccu-open');
   b.textContent=open?'Chiudi comandi ✕':'✦ Ricerca AI';
   b.setAttribute('aria-expanded',String(open));
  };
  bar.querySelectorAll('.demo').forEach(function(x){
   x.addEventListener('click',reset);
  });
 }
 try{
